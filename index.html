<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知杖</title>
<style>
:root {
  --bg: #f4f6f9;
  --card: #fff;
  --border: #e3e8ef;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --ok: #16a34a;
  --bad: #dc2626;
  --warn: #d97706;
  --text: #1f2937;
  --muted: #6b7280;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.container { max-width: 860px; margin: 0 auto; padding: 16px; }

/* 顶部 */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 0; }
header h1 { font-size: 20px; flex-shrink: 0; }
.bank-select { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.bank-select select { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--card); }
.bank-select .btn { flex-shrink: 0; }

/* 按钮 */
.btn {
  padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: opacity .15s; background: var(--primary); color: #fff;
}
.btn:hover { opacity: .85; }
.btn.secondary { background: #eef2f7; color: var(--text); }
.btn.success { background: var(--ok); }
.btn.danger { background: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* 设置面板 */
.setup-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 12px 0; }
.setup-panel h2 { font-size: 16px; margin-bottom: 16px; }
.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.mode-card {
  border: 2px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color .15s;
}
.mode-card.active { border-color: var(--primary); background: #f0f6ff; }
.mode-card h3 { font-size: 15px; margin-bottom: 4px; }
.mode-card p { font-size: 13px; color: var(--muted); }
.setup-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.setup-row label { font-size: 14px; color: var(--muted); min-width: 70px; }
.setup-row input[type=number], .setup-row input[type=text] {
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; width: 90px; font-size: 14px;
}
.setup-row .wide { width: 200px; }
.setup-actions { display: flex; gap: 10px; margin-top: 16px; }

/* 题目 */
.quiz-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 12px 0; }
.q-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.q-num { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; }
.timer { font-size: 15px; font-weight: 700; color: var(--primary); white-space: nowrap; }
.q-progress { font-size: 13px; color: var(--muted); flex: 1; text-align: right; }
.fav-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 2px 6px; vertical-align: middle; line-height: 1; }
.fav-btn.active { color: #f59e0b; }
.q-progress { font-size: 13px; color: var(--muted); }
.q-text { font-size: 15px; line-height: 1.7; white-space: pre-wrap; margin-bottom: 8px; }
.q-img-wrap { margin: 12px 0; text-align: center; }
.q-img-wrap img { max-width: 100%; max-height: 420px; border: 1px solid var(--border); border-radius: 8px; }
.q-desc {
  font-size: 13px; color: var(--muted); background: #f8fafc; border: 1px dashed var(--border);
  border-radius: 8px; padding: 10px; margin: 8px 0; white-space: pre-wrap;
}
.option { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; cursor: pointer; transition: all .15s; }
.option:hover { border-color: #b8c6dd; }
.option .opt-key { font-weight: 600; color: var(--primary); min-width: 24px; }
.option .opt-val { flex: 1; white-space: pre-wrap; }
.option input { margin-top: 3px; }
.option.correct { border-color: var(--ok); background: #f0fdf4; }
.option.wrong { border-color: var(--bad); background: #fef2f2; }
.fill-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }

/* 移动端触控优化 */
@media (max-width: 640px) {
  body { -webkit-text-size-adjust: 100%; }
  .option { padding: 14px 12px; }
  .option input { width: 20px; height: 20px; margin-top: 1px; flex-shrink: 0; }
  .q-text { font-size: 16px; }
  .btn { padding: 12px 18px; }
  .btn.small { padding: 10px 14px; }
  .action-bar .btn { flex: 1; }
  .fill-input { font-size: 16px; padding: 12px; }
  .explain { font-size: 15px; }
}

/* 解析 */
.explain { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 14px; line-height: 1.7; }
.explain h4 { color: var(--warn); margin-bottom: 6px; }

/* 结果 */
.result-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; }
.result-box .score { font-size: 42px; font-weight: 700; }
.result-box .score.ok { color: var(--ok); }
.result-box .score.mid { color: var(--warn); }
.result-box .score.bad { color: var(--bad); }
.result-stats { display: flex; justify-content: center; gap: 30px; margin: 18px 0; flex-wrap: wrap; }
.result-stats .stat { text-align: center; }
.result-stats .stat b { display: block; font-size: 24px; }
.result-stats .stat span { font-size: 13px; color: var(--muted); }

/* 答题卡 / 底部 */
.action-bar { display: flex; justify-content: space-between; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
.progress-track { height: 6px; background: var(--border); border-radius: 3px; margin: 10px 0; overflow: hidden; }
.progress-track .fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .2s; }

/* 错题本 */
.wrong-list { list-style: none; }
.wrong-list li { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 8px 0; cursor: pointer; }
.wrong-list li:hover { border-color: var(--primary); }
.wrong-list .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; background: #fee2e2; color: var(--bad); }

/* 自定义弹窗 */
.modal-mask {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center;
  padding: 24px; animation: fadeIn .15s ease;
}
.modal-box {
  width: 100%; max-width: 360px; background: var(--card); border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25); overflow: hidden; animation: popIn .18s ease;
}
.modal-title { font-size: 16px; font-weight: 600; padding: 18px 20px 0; color: var(--text); }
.modal-body { font-size: 14px; line-height: 1.7; padding: 12px 20px 20px; color: var(--text); white-space: pre-wrap; }
.modal-actions { display: flex; border-top: 1px solid var(--border); }
.modal-actions .m-btn {
  flex: 1; padding: 14px; border: none; background: none; font-size: 15px; cursor: pointer; color: var(--text);
}
.modal-actions .m-btn + .m-btn { border-left: 1px solid var(--border); }
.modal-actions .m-btn.ok { color: var(--primary); font-weight: 600; }
.modal-actions .m-btn.cancel { color: var(--muted); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 历史成绩 */
.history-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.history-table th, .history-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
.history-table th { color: var(--muted); font-weight: 500; }

/* 空状态 */
.empty { text-align: center; color: var(--muted); padding: 40px 20px; }
.empty .big { font-size: 40px; margin-bottom: 12px; }

/* 收藏浮动按钮 (FAB) */
.fab {
  position: fixed; left: auto; top: auto; z-index: 100;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--card); border: 2px solid var(--border);
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
  font-size: 26px; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.fab.active { border-color: #f59e0b; color: #f59e0b; background: #fffbeb; }
.fab.hidden { display: none !important; }

/* 错题本 tab */
.tabs { display: flex; gap: 8px; margin: 4px 0 14px; }
.tab-btn {
  flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); color: var(--muted); font-size: 14px; cursor: pointer;
  text-align: center;
}
.tab-btn.active { border-color: var(--primary); color: var(--primary); background: #f0f6ff; font-weight: 600; }

/* 错题按次记录 */
.wrong-session {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; margin: 8px 0; cursor: pointer;
}
.wrong-session:hover { border-color: var(--primary); }
.wrong-session .ws-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.wrong-session .ws-nums { font-size: 13px; color: var(--muted); margin-top: 6px; }
.wrong-session .ws-nums .wnum {
  display: inline-block; padding: 2px 8px; margin: 2px; background: #fee2e2;
  color: var(--bad); border-radius: 10px; font-size: 12px;
}

/* 统计图表 */
.stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 10px 0; }
.stat-box h3 { font-size: 15px; margin-bottom: 10px; color: var(--text); }
.stat-box canvas { max-height: 260px; }
.stat-rank { list-style: none; }
.stat-rank li {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; margin: 8px 0; cursor: pointer;
}
.stat-rank li:hover { border-color: var(--primary); }
.stat-rank .sr-info { font-size: 14px; }
.stat-rank .sr-rate { font-size: 14px; font-weight: 700; color: var(--bad); }
.stat-rank .sr-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* 考试错题答题卡 */
.answer-sheet {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; margin: 12px 0;
}
.answer-sheet .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
.answer-sheet .cell {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  background: #eef2f7; color: var(--text); border: 1px solid var(--border);
}
.answer-sheet .cell.ok { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
.answer-sheet .cell.bad { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
.answer-sheet .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 12px; }
.answer-sheet .legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.answer-sheet .legend .dot.ok { background: #6ee7b7; }
.answer-sheet .legend .dot.bad { background: #fca5a5; }
.answer-sheet .legend .dot.na { background: #eef2f7; border: 1px solid var(--border); }

.hidden { display: none !important; }
@media (max-width: 640px) { .mode-cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script src="vendor/chart.umd.js"></script>
<!-- 自定义弹窗 -->
<div id="modalMask" class="modal-mask hidden">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="m-btn cancel" id="modalCancel">取消</button>
      <button class="m-btn ok" id="modalOk">确定</button>
    </div>
  </div>
</div>
<div class="container">
  <header>
    <h1>📚 知杖<span id="appVersion" style="font-size:.6em;opacity:.55;margin-left:8px;font-weight:400"></span></h1>
    <div class="bank-select">
      <select id="bankSelect" onchange="switchBank()"></select>
      <button class="btn small" onclick="document.getElementById('importFile').click()">导入题库</button>
      <input type="file" id="importFile" accept="*/*" style="display:none" onchange="importBank(event)">
    </div>
  </header>

  <div id="emptyState" class="empty">
    <div class="big">📂</div>
    <p>还没有题库，点击右上角「导入题库」选择 .bank 文件开始刷题。</p>
    <p style="font-size:13px;color:var(--muted);margin-top:8px">格式：JSON，含 name 与 questions 数组，见 bank/ 目录示例。</p>
  </div>

  <!-- 设置面板 -->
  <div id="setupPanel" class="setup-panel hidden">
    <h2>开始刷题</h2>
    <div class="mode-cards">
      <div class="mode-card active" data-mode="practice" onclick="setMode('practice')">
        <h3>练习模式</h3>
        <p>点「下一题」判对错，答错显示解析，适合学习</p>
      </div>
      <div class="mode-card" data-mode="exam" onclick="setMode('exam')">
        <h3>模拟考试</h3>
        <p>限时作答，交卷统一出成绩，不显示答案</p>
      </div>
    </div>
    <div class="setup-row">
      <label>题目范围</label>
      <select id="scopeSelect" onchange="onScopeChange()">
        <option value="all">全部题目</option>
        <option value="wrong">仅错题本</option>
        <option value="fav">仅收藏</option>
        <option value="random">随机抽取</option>
      </select>
      <span id="randomCountWrap" class="hidden">
        <input type="number" id="randomCount" value="20" min="1" max="500">
      </span>
      <span id="scopeInfo" style="font-size:13px;color:var(--muted)"></span>
    </div>
    <div id="examOpts" class="setup-row hidden">
      <label>限时(分钟)</label>
      <input type="number" id="examMinutes" value="60" min="1" max="600">
    </div>
    <div class="setup-actions">
      <button class="btn" onclick="startQuiz()">开始刷题</button>
      <button class="btn secondary" onclick="showWrongBook()">错题本</button>
      <button class="btn secondary" onclick="showHistory()">历史成绩</button>
    </div>
  </div>

  <!-- 题目区 -->
  <div id="quizArea" class="hidden">
    <button id="favFab" class="fab hidden" title="收藏">☆</button>
    <div class="q-head">
      <span class="q-num" id="qNum"></span>
      <span id="timerWrap" class="timer hidden"></span>
      <span class="q-progress" id="qProgress"></span>
    </div>
    <div class="progress-track"><div class="fill" id="progressFill"></div></div>
    <div class="quiz-card" id="quizCard"></div>
    <div class="action-bar">
      <button class="btn secondary" id="prevBtn" onclick="prev()">上一题</button>
      <button class="btn secondary" id="clearBtn" onclick="clearAnswer()">清除本题</button>
      <button class="btn" id="nextBtn" onclick="next()">下一题</button>
    </div>
    <div class="action-bar" style="justify-content:center">
      <button class="btn danger" id="submitBtn" onclick="submitQuiz()" style="display:none">交卷</button>
      <button class="btn secondary" onclick="quitQuiz()">退出</button>
    </div>
  </div>

  <!-- 结果区 -->
  <div id="resultArea" class="hidden">
    <div class="result-box" id="resultBox"></div>
    <div class="action-bar" style="justify-content:center">
      <button class="btn" onclick="startQuiz()">再来一次</button>
      <button class="btn secondary" onclick="showWrongBook()">查看错题本</button>
      <button class="btn secondary" onclick="showHistory()">历史成绩</button>
      <button class="btn secondary" onclick="resetToSetup()">返回</button>
    </div>
  </div>

  <!-- 错题本 / 收藏 / 统计 / 历史 视图 -->
  <div id="subView" class="hidden">
    <div class="action-bar">
      <button class="btn secondary" onclick="resetToSetup()">← 返回</button>
      <button id="practiceFavBtn" class="btn success hidden" onclick="practiceFav()">练习收藏</button>
    </div>
    <div id="subTabs" class="tabs hidden">
      <button class="tab-btn" data-tab="wrong" onclick="showWrongBook()">考试错题</button>
      <button class="tab-btn" data-tab="fav" onclick="showFavBook()">手动收藏</button>
    </div>
    <div id="subContent"></div>
  </div>
</div>

<script>
/* ========== 状态 ========== */
const APP_VERSION = "1.1";
const STORE_KEY = "zz_quiz_banks_v1";
const HISTORY_KEY = "zz_quiz_history_v1";
const WRONG_KEY = "zz_quiz_wrong_v1";
const FAV_KEY = "zz_quiz_fav_v1";
const WRONGLOG_KEY = "zz_quiz_wronglog_v1";
const STAT_KEY = "zz_quiz_stat_v1";
const PRACTICE_RESUME_KEY = "zz_practice_resume_v1";

let banks = [];          // 已导入题库 [{name, questions}]
let curBank = null;      // 当前题库
let session = null;      // 本次会话 {mode, questions[], answers{}, t0, timer, curIdx, minutes}
let mode = "practice";

/* ========== IndexedDB 存储（题库大，localStorage 不够） ========== */
const DB_NAME = "zz_quiz_db";
const DB_VER = 1;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("banks")) db.createObjectStore("banks", { keyPath: "name" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPutAll(bankList) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("banks", "readwrite");
    const store = tx.objectStore("banks");
    bankList.forEach(b => store.put(b));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("banks", "readonly");
    const req = tx.objectStore("banks").getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(name) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("banks", "readwrite");
    tx.objectStore("banks").delete(name);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ========== 小数据存储（原生 SharedPreferences + localStorage 兜底） ==========
 * APK 内 WebView 的 localStorage 在杀后台(SIGKILL)时不保证落盘，会丢进度/成绩。
 * 优先写 @capacitor/preferences（Android 原生存储，原子落盘可靠），localStorage 仅作网页版兜底。
 * loadLS 走内存缓存（prefsHydrate 启动时一次性载入），保持现有同步读取代码不变。
 */
const prefs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
const lsCache = {};
async function prefsHydrate() {
  if (prefs) {
    // 一次性迁移：把旧版 localStorage 里已有的 zz_* 数据搬进 Preferences
    try {
      const zzKeys = Object.keys(localStorage).filter(k => k.startsWith("zz_"));
      if (zzKeys.length) {
        for (const k of zzKeys) {
          const v = localStorage.getItem(k);
          if (v != null) await prefs.set({ key: k, value: v });
        }
      }
    } catch(e) { console.warn("localStorage 迁移失败", e); }
    try {
      const { keys } = await prefs.keys();
      for (const k of (keys || []).filter(x => x.startsWith("zz_"))) {
        const { value } = await prefs.get({ key: k });
        if (value != null) try { lsCache[k] = JSON.parse(value); } catch(e) {}
      }
    } catch(e) { console.warn("Preferences 载入失败", e); }
  } else {
    // 网页版：直接从 localStorage 载入缓存
    try {
      for (const k of Object.keys(localStorage)) {
        if (k.startsWith("zz_")) {
          try { lsCache[k] = JSON.parse(localStorage.getItem(k)); } catch(e) {}
        }
      }
    } catch(e) {}
  }
}
function saveLS(key, val) {
  lsCache[key] = val;
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
  if (prefs) prefs.set({ key, value: JSON.stringify(val) }).catch(e => console.warn("Preferences 写入失败", e));
}
function loadLS(key, def) {
  if (key in lsCache) return lsCache[key];
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch(e) { return def; }
}
function removeLS(key) {
  delete lsCache[key];
  try { localStorage.removeItem(key); } catch(e) {}
  if (prefs) prefs.remove({ key }).catch(e => console.warn("Preferences 删除失败", e));
}

async function loadBanks() {
  try {
    banks = await idbGetAll();
  } catch(e) {
    console.warn("IndexedDB 读取失败", e);
    banks = [];
  }
  banks.sort((a, b) => a.name.localeCompare(b.name, "zh"));
  renderBankSelect();
}
async function persistBanks() {
  try { await idbPutAll(banks); } catch(e) { console.warn("IndexedDB 写入失败", e); }
}

/* ========== 导入 ========== */
// 内置题库：把 .bank 放进 bank/ 目录后在这里登记文件名；也可以留空，用「导入题库」按钮手动导入
const BUNDLED_BANKS = [];
function normalizeBank(raw, name) {
  if (!raw || !Array.isArray(raw.questions)) throw new Error("格式不对");
  return {
    name: raw.name || name,
    questions: raw.questions.filter(q => q && !q.meta?.bad).map(q => ({
      num: q.num, type: q.type || (q.options?.length ? "choice" : "fill"),
      text: q.text || "", options: q.options || [], answer: q.answer || null,
      explain: q.explain || "", image: q.image || null, desc: q.desc || "",
      meta: q.meta || {},
    })),
  };
}
async function addBank(bank) {
  banks = banks.filter(b => b.name !== bank.name);
  banks.push(bank);
  banks.sort((a, b) => a.name.localeCompare(b.name, "zh"));
  await persistBanks();
  renderBankSelect();
  selectBank(bank.name);
}
async function autoImportBundled() {
  const have = banks.map(b => b.name);
  for (const url of BUNDLED_BANKS) {
    const fallback = decodeURIComponent(url.split("/").pop().replace(/\.(bank|json)$/i, ""));
    if (have.includes(fallback)) continue;
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const raw = await res.json();
      const bank = normalizeBank(raw, fallback);
      await addBank(bank);
    } catch (e) {
      console.warn("自动导入失败:", url, e);
    }
  }
  if (!banks.length) renderBankSelect();
}
function importBank(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const obj = JSON.parse(reader.result);
      const bank = normalizeBank(obj, file.name.replace(/\.(bank|json)$/i, ""));
      await addBank(bank);
      showDialog({ title: "导入成功", text: `${bank.name}，共 ${bank.questions.length} 题` });
    } catch (e) {
      showDialog({ title: "导入失败", text: e.message });
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

function renderBankSelect() {
  const sel = document.getElementById("bankSelect");
  sel.innerHTML = "";
  banks.forEach(b => {
    const opt = document.createElement("option");
    opt.value = b.name;
    opt.textContent = `${b.name} (${b.questions.length})`;
    sel.appendChild(opt);
  });
  if (!banks.length) {
    document.getElementById("emptyState").classList.remove("hidden");
    document.getElementById("setupPanel").classList.add("hidden");
    document.getElementById("subView").classList.add("hidden");
    document.getElementById("quizArea").classList.add("hidden");
    document.getElementById("resultArea").classList.add("hidden");
  } else {
    document.getElementById("emptyState").classList.add("hidden");
  }
}

function switchBank() {
  const name = document.getElementById("bankSelect").value;
  selectBank(name);
}
function selectBank(name) {
  curBank = banks.find(b => b.name === name) || null;
  if (!curBank) return;
  // 同步下拉框选中值（不重建，避免选中值复位）

}

/* ========== 模式 & 设置 ========== */
function setMode(m) {
  mode = m;
  updateModeCards();
  document.getElementById("examOpts").classList.toggle("hidden", m !== "exam");
}
function updateModeCards() {
  document.querySelectorAll(".mode-card").forEach(c => {
    c.classList.toggle("active", c.dataset.mode === mode);
  });
  document.getElementById("examOpts").classList.toggle("hidden", mode !== "exam");
}
function onScopeChange() {
  const scope = document.getElementById("scopeSelect").value;
  document.getElementById("randomCountWrap").classList.toggle("hidden", scope !== "random");
  updateScopeInfo();
}
function updateScopeInfo() {
  if (!curBank) return;
  const scope = document.getElementById("scopeSelect").value;
  const total = curBank.questions.length;
  const wrongN = wrongOf(curBank.name).length;
  const favN = favOf(curBank.name).length;
  let info = `共 ${total} 题`;
  if (scope === "wrong") info = `错题 ${wrongN} 题`;
  if (scope === "fav") info = `收藏 ${favN} 题`;
  document.getElementById("scopeInfo").textContent = info;
}

/* ========== 洗牌 ========== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ========== 开始 ========== */
function pickQuestions() {
  const scope = document.getElementById("scopeSelect").value;
  let pool;
  if (scope === "wrong") {
    const wrongNums = wrongOf(curBank.name);
    pool = curBank.questions.filter(q => wrongNums.includes(q.num));
    if (!pool.length) { showDialog({ title: "提示", text: "错题本是空的，先刷几题吧！" }); return null; }
  } else if (scope === "fav") {
    const favNums = favOf(curBank.name);
    pool = curBank.questions.filter(q => favNums.includes(q.num));
    if (!pool.length) { showDialog({ title: "提示", text: "还没有收藏的题，刷题时点 ☆ 收藏！" }); return null; }
  } else if (scope === "random") {
    const n = Math.min(parseInt(document.getElementById("randomCount").value) || 20, curBank.questions.length);
    pool = shuffle(curBank.questions).slice(0, n);
  } else {
    pool = curBank.questions;
  }
  // 乱序题目
  return shuffle(pool);
}

async function startQuiz(presetNums) {
  if (!curBank) return;
  const scope = document.getElementById("scopeSelect").value;
  // 练习模式：检测上次未完成进度，询问是否继续（仅非指定题号时）
  if (mode === "practice" && !presetNums) {
    const resume = loadLS(PRACTICE_RESUME_KEY, null);
    if (resume && resume.bankName === curBank.name && resume.scope === scope && hasResumeProgress(resume) && resume.curIdx >= 0 && resume.curIdx < resume.items.length) {
      const goOn = await showDialog({
        title: "继续上次练习？",
        text: `发现上次未完成的练习进度（第 ${resume.curIdx + 1}/${resume.items.length} 题）`,
        okText: "继续", cancelText: "重新开始",
      });
      if (goOn) {
        session = {
          mode, scope,
          questions: resume.items.map(it => {
            const q = curBank.questions.find(x => x.num === it.num);
            if (!q) return null;
            let opts = it.opts;   // 兼容旧格式（完整 opts）
            if (!opts && Array.isArray(it.order)) {
              const letters = "ABCDEFGH";
              opts = it.order.map((orig, i) => ({ disp: letters[i], orig, v: (q.options.find(o => o.k === orig) || {}).v || "" }));
            }
            return { q, opts };
          }).filter(Boolean),
          answers: resume.answers || {}, marked: resume.marked || {},
          curIdx: Math.min(resume.curIdx, resume.items.length - 1),
          t0: resume.t0 || Date.now(), minutes: 0,
          wrongs: [], bankName: curBank.name,
        };
        if (!session.questions.length) { showDialog({ title: "提示", text: "题库已更新，无法恢复，重新开始。" }); clearResume(); }
        else {
          showQuizArea();
          renderQuestion();
          return;
        }
      } else {
        clearResume();
      }
    }
  }
  let pool;
  if (presetNums && presetNums.length) {
    // 指定题号（按传入顺序，通常升序）：仅这些题，不走 scope/乱序
    pool = curBank.questions.filter(q => presetNums.includes(q.num));
    if (!pool.length) { showDialog({ title: "提示", text: "题目在题库中不存在，无法重刷。" }); return; }
  } else {
    pool = pickQuestions();
    if (!pool) return;
  }
  const qs = pool.map(q => {
    // 选项乱序：打乱内容，但重新分配固定显示字母 A/B/C/D...
    // disp=显示字母(固定顺序), orig=原始答案字母, v=选项内容
    let opts;
    if (q.type === "choice") {
      const letters = "ABCDEFGH";
      const shuffled = shuffle(q.options.slice());
      opts = shuffled.map((o, i) => ({ disp: letters[i], orig: o.k, v: o.v }));
    } else {
      opts = q.options.map((o, i) => ({ disp: "", orig: o.k, v: o.v }));
    }
    return { q, opts };
  });
  const minutes = mode === "exam" ? (parseInt(document.getElementById("examMinutes").value) || 60) : 0;
  session = {
    mode, scope: presetNums ? null : scope, questions: qs, answers: {}, curIdx: 0,
    t0: Date.now(), minutes,
    wrongs: [], bankName: curBank.name,
  };
  showQuizArea();
  renderQuestion();
}

function showQuizArea() {
  document.getElementById("setupPanel").classList.add("hidden");
  document.getElementById("quizArea").classList.remove("hidden");
  document.getElementById("resultArea").classList.add("hidden");
  document.getElementById("subView").classList.add("hidden");
  document.getElementById("submitBtn").style.display = "";
  document.getElementById("submitBtn").textContent = mode === "exam" ? "交卷" : "结束";
  document.getElementById("timerWrap").classList.toggle("hidden", mode !== "exam");
  if (mode === "exam") session.timer = setInterval(tick, 1000);
}

function tick() {
  if (!session) return;
  const el = document.getElementById("timerWrap");
  const elapsed = Math.floor((Date.now() - session.t0) / 1000);
  const remain = session.minutes * 60 - elapsed;
  if (remain <= 0) { clearInterval(session.timer); el.textContent = "时间到！"; submitQuiz(); return; }
  el.textContent = `⏱ ${Math.floor(remain / 60)}:${String(remain % 60).padStart(2, "0")}`;
}

/* ========== 渲染题目 ========== */
function renderQuestion() {
  const idx = session.curIdx;
  const item = session.questions[idx];
  const q = item.q;
  const qNumEl = document.getElementById("qNum");
  qNumEl.textContent = `第 ${idx + 1} / ${session.questions.length} 题  ·  ${q.num ? "题库 #" + q.num : ""}`;
  // 浮动收藏按钮状态
  const fab = document.getElementById("favFab");
  const fav = isFav(session.bankName, q.num);
  fab.classList.toggle("active", fav);
  fab.textContent = fav ? "★" : "☆";
  fab.classList.remove("hidden");
  document.getElementById("qProgress").textContent = session.mode === "exam" ? "考试中" : "练习";
  document.getElementById("progressFill").style.width = ((idx + 1) / session.questions.length * 100) + "%";

  const card = document.getElementById("quizCard");
  card.innerHTML = `<div class="q-text"></div>`;
  const txtEl = card.querySelector(".q-text");
  txtEl.textContent = q.text;

  if (q.image) {
    const w = document.createElement("div");
    w.className = "q-img-wrap";
    const img = document.createElement("img");
    img.src = q.image;
    img.alt = "题目插图";
    w.appendChild(img);
    card.appendChild(w);
  }
  if (q.desc) {
    const d = document.createElement("div");
    d.className = "q-desc";
    d.textContent = "📝 识图转述：" + q.desc;
    card.appendChild(d);
  }

  if (q.type === "fill") {
    const inp = document.createElement("input");
    inp.className = "fill-input";
    inp.placeholder = "请输入答案";
    inp.value = session.answers[q.num] || "";
    inp.addEventListener("input", () => { session.answers[q.num] = inp.value; saveResumeDebounced(); });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && session.mode === "practice" && !isMarked(idx)) {
        mark(idx); renderQuestion();
      }
    });
    card.appendChild(inp);
    if (session.mode === "practice" && !isMarked(idx)) {
      const btn = document.createElement("button");
      btn.className = "btn small";
      btn.textContent = "判题";
      btn.style.marginTop = "10px";
      btn.onclick = () => { mark(idx); renderQuestion(); };
      card.appendChild(btn);
    }
  } else {
    const myAnswerDisp = session.answers[q.num] || [];
    const judged = isMarked(idx);
    const showJudge = session.mode === "practice" && judged;
    item.opts.forEach(({ disp, orig, v }) => {
      const div = document.createElement("div");
      div.className = "option";
      if (showJudge) {
        // 已判分，展示对错（disp 显示字母，orig 对应标准答案）
        const correct = (q.answer || []).includes(orig);
        const chosen = myAnswerDisp.includes(disp);
        if (correct) div.classList.add("correct");
        else if (chosen) div.classList.add("wrong");
      }
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = myAnswerDisp.includes(disp);
      cb.disabled = showJudge;
      // 点 checkbox 本身时阻止冒泡到 div（避免双翻转）
      cb.addEventListener("click", (e) => e.stopPropagation());
      cb.addEventListener("change", () => {
        // 只记录答案，不判分、不重建 DOM
        let cur = session.answers[q.num] || [];
        if (cb.checked) cur.push(disp); else cur = cur.filter(x => x !== disp);
        session.answers[q.num] = cur;
        saveResume();
      });
      const k = document.createElement("span");
      k.className = "opt-key";
      k.textContent = disp + ".";
      const v2 = document.createElement("span");
      v2.className = "opt-val";
      v2.textContent = v;
      div.appendChild(cb); div.appendChild(k); div.appendChild(v2);
      // 点整行（文字/空白）切换勾选：翻转 checkbox，由 change 统一记录答案
      if (!showJudge) {
        div.addEventListener("click", () => {
          cb.checked = !cb.checked;
          cb.dispatchEvent(new Event("change"));
        });
      }
      card.appendChild(div);
    });
  }

  // 练习模式：若已判分，显示解析
  if (session.mode === "practice" && isMarked(idx)) {
    showResult(idx);
  }
  // 练习模式：未判分时显示「下一题判题」提示按钮
  if (session.mode === "practice" && !isMarked(idx)) {
    const hint = document.createElement("div");
    hint.style.cssText = "font-size:13px;color:var(--muted);margin-top:12px;text-align:center";
    hint.textContent = "选好后点「下一题」判对错" + (q.type === "fill" ? "，或按回车判题" : "");
    card.appendChild(hint);
  }
  document.getElementById("prevBtn").disabled = idx === 0;
  // 写穿式保存：每次渲染都落盘，被杀进程也有最新进度（saveResume 内部守卫练习/非回看模式）
  saveResume();
}

function isMarked(idx) { return idx in (session.marked || {}); }
function toggleFavFab() {
  if (!session) return;
  const q = session.questions[session.curIdx].q;
  toggleFav(session.bankName, q.num);
  const btn = document.getElementById("favFab");
  btn.classList.toggle("active");
  btn.textContent = btn.classList.contains("active") ? "★" : "☆";
}
function mark(idx) {
  session.marked = session.marked || {};
  session.marked[idx] = true;
}

function myAnswer(q, item) {
  if (q.type === "fill") {
    const val = (session.answers[q.num] || "").toString().trim().replace(/\s+/g, "");
    const std = (q.answer || [""])[0] || "";
    const std2 = std.trim().replace(/\s+/g, "");
    const ok = val !== "" && (val === std2 || val.toUpperCase() === std2.toUpperCase());
    return { ok, correct: [std] };
  }
  // 用户勾选的是 disp 显示字母，映射回 orig 原始答案字母比对
  const chosenDisp = session.answers[q.num] || [];
  const chosenOrig = chosenDisp.map(d => {
    const o = item.opts.find(x => x.disp === d);
    return o ? o.orig : d;
  });
  const correct = q.answer || [];
  const ok = chosenOrig.length === correct.length && correct.every(a => chosenOrig.includes(a));
  // 返回 correct 的显示字母（用于解析展示）
  const correctDisp = item.opts.filter(o => correct.includes(o.orig)).map(o => o.disp);
  return { ok, chosen: chosenDisp, correct: correctDisp };
}

function showResult(idx) {
  const item = session.questions[idx];
  const q = item.q;
  const r = myAnswer(q, item);
  const card = document.getElementById("quizCard");
  // 移除旧解析
  card.querySelectorAll(".explain").forEach(e => e.remove());

  const ex = document.createElement("div");
  ex.className = "explain";
  // 回看模式：不判对错，只展示参考答案
  const title = session.review ? "📖 参考答案" : (r.ok ? "✅ 回答正确" : "❌ 回答错误");
  ex.innerHTML = `<h4>${title}</h4>`;
  if (q.type === "choice") {
    const corrText = r.correct.map(disp => {
      const o = item.opts.find(x => x.disp === disp);
      return `${disp}. ${o ? o.v : ""}`;
    }).join("\n");
    ex.innerHTML += `<div style="margin:6px 0"><b>正确答案：</b><br>${corrText.replace(/\n/g, "<br>")}</div>`;
  } else {
    ex.innerHTML += `<div style="margin:6px 0"><b>正确答案：</b> ${r.correct[0] || "(无)"}</div>`;
  }
  if (q.explain) ex.innerHTML += `<div style="margin-top:6px"><b>解析：</b><br>${q.explain.replace(/\n/g, "<br>")}</div>`;
  card.appendChild(ex);
}

/* ========== 导航 ========== */
function prev() { if (session.curIdx > 0) { session.curIdx--; renderQuestion(); } }
function next() {
  if (!session) return;
  const idx = session.curIdx;
  const item = session.questions[idx];
  // 回看模式：直接切题，到末题停留，不交卷
  if (session.review) {
    if (session.curIdx < session.questions.length - 1) {
      session.curIdx++; renderQuestion();
    } else {
      toast("已是最后一题");
    }
    return;
  }
  // 练习模式：点下一题先判当前题，答对直接进，答错停留看解析
  if (session.mode === "practice" && !isMarked(idx)) {
    mark(idx);
    const r = myAnswer(item.q, item);
    renderQuestion();
    if (!r.ok) {
      // 答错：停留本题显示解析
      return;
    }
  }
  if (session.curIdx < session.questions.length - 1) {
    session.curIdx++; renderQuestion();
  } else {
    // 最后一题已判完，直接进入结果
    submitQuiz();
  }
}
function clearAnswer() {
  const q = session.questions[session.curIdx].q;
  delete session.answers[q.num];
  delete session.marked[session.curIdx];
  renderQuestion();
}
function quitQuiz() {
  if (session.timer) clearInterval(session.timer);
  // 练习模式退出：保存进度供下次续做
  if (session.mode === "practice") saveResume();
  session = null;
  resetToSetup();
}

/* ========== 练习进度记忆 ========== */
function saveResume() {
  if (!session || session.mode !== "practice" || session.review || !session.scope) return;
  // 只存选项原始顺序 order（如 ["B","C","A"]），恢复时从题库重建 opts，比存完整 opts(~150KB) 小得多
  const items = session.questions.map(it => ({
    num: it.q.num,
    order: it.q.type === "choice" ? it.opts.map(o => o.orig) : [],
  }));
  saveLS(PRACTICE_RESUME_KEY, {
    bankName: session.bankName, scope: session.scope,
    curIdx: session.curIdx, answers: session.answers || {},
    marked: session.marked || {}, items, t0: session.t0,
  });
}
let resumeSaveTimer = null;
function saveResumeDebounced() {
  clearTimeout(resumeSaveTimer);
  resumeSaveTimer = setTimeout(saveResume, 300);
}
function hasResumeProgress(resume) {
  const answers = resume.answers || {};
  return resume.curIdx > 0 || Object.keys(answers).length > 0;
}
function clearResume() {
  removeLS(PRACTICE_RESUME_KEY);
}

/* ========== 交卷 ========== */
async function submitQuiz() {
  if (session.mode === "exam") {
    const ok = await showDialog({ title: "确认交卷？", text: "交卷后将统计成绩并记录本次错题。", okText: "交卷", cancelText: "再检查" });
    if (!ok) return;
    if (session.timer) clearInterval(session.timer);
  }  const results = session.questions.map((item, idx) => {
    const r = myAnswer(item.q, item);
    return { item, r, idx };
  });
  const total = results.length;
  const correct = results.filter(x => x.r.ok).length;
  const wrongs = results.filter(x => !x.r.ok);
  const elapsed = Math.floor((Date.now() - session.t0) / 1000);
  const mins = Math.floor(elapsed / 60), secs = elapsed % 60;

  // 记录错题
  const wrongSet = new Set(wrongOf(session.bankName));
  wrongs.forEach(x => wrongSet.add(x.item.q.num));
  // 答对的从错题移除
  const correctNums = new Set(results.filter(x => x.r.ok).map(x => x.item.q.num));
  saveWrong(session.bankName, [...wrongSet].filter(n => !correctNums.has(n)));

  // 记录按次错题（每次考试一条，仅考试模式；练习错题只进聚合错题本）
  if (session.mode === "exam") {
    const wronglog = loadLS(WRONGLOG_KEY, {});
    const wl = wronglog[session.bankName] || [];
    wl.unshift({
      ts: Date.now(), mode: session.mode,
      date: new Date().toLocaleString("zh-CN"),
      wrongNums: wrongs.map(x => x.item.q.num),
      qNums: session.questions.map(x => x.q.num),
      total, correct,
    });
    wronglog[session.bankName] = wl.slice(0, 200);
    saveLS(WRONGLOG_KEY, wronglog);
  }
  // 练习模式结束：清除续做进度（做完了才是全新一轮）
  if (session.mode === "practice") clearResume();

  // 统计每题做次/错次
  const stat = loadLS(STAT_KEY, {});
  const st = stat[session.bankName] || {};
  results.forEach(x => {
    const num = x.item.q.num;
    const rec = st[num] || { tries: 0, wrong: 0 };
    rec.tries++;
    if (!x.r.ok) rec.wrong++;
    st[num] = rec;
  });
  stat[session.bankName] = st;
  saveLS(STAT_KEY, stat);

  // 记录历史
  const history = loadLS(HISTORY_KEY, []);
  history.unshift({
    ts: Date.now(), bank: session.bankName, mode: session.mode,
    total, correct, wrong: total - correct, score: Math.round(correct / total * 100),
    time: `${mins}分${secs}秒`, date: new Date().toLocaleString("zh-CN"),
  });
  saveLS(HISTORY_KEY, history.slice(0, 200));

  // 练习模式也展示全部对错
  session.marked = {};
  results.forEach((x, i) => { if (!x.r.ok) session.marked[i] = true; });

  showResultView({ correct, total, wrong: total - correct, elapsed, wrongs });
}

function renderStat(container) {
  if (!curBank) return;
  const stat = loadLS(STAT_KEY, {})[curBank.name] || {};
  const history = loadLS(HISTORY_KEY, []).filter(h => h.bank === curBank.name);

  if (!Object.keys(stat).length && !history.length) {
    container.innerHTML = '<div class="empty"><div class="big">📊</div><p>还没有做题数据，刷几题后这里会出现分析图表。</p></div>';
    return;
  }

  let html = `<h2 style="font-size:16px;margin-bottom:12px">错题统计</h2>`;
  html += `<div class="stat-box"><h3>每次正确率趋势</h3><div style="height:240px"><canvas id="statLine"></canvas></div></div>`;
  html += `<div class="stat-box"><h3>做题对错分布</h3><div style="height:240px"><canvas id="statPie"></canvas></div></div>`;
  html += `<div class="stat-box"><h3>出错率最高 TOP 10</h3><div style="height:${Math.min(10, topN(stat).length || 1) * 30 + 40}px"><canvas id="statBar"></canvas></div></div>`;
  html += `<h3 style="font-size:15px;margin:16px 0 8px">出错排行 TOP 10</h3><ul class="stat-rank"></ul>`;
  container.innerHTML = html;

  // 折线图：正确率趋势
  const lineData = history.slice().reverse().map((h, i) => ({
    x: h.date.slice(5, 16), y: h.score,
  }));
  // 饼图：对/错次数
  let okCount = 0, errCount = 0;
  Object.values(stat).forEach(r => { okCount += (r.tries - r.wrong); errCount += r.wrong; });
  // 条形：TOP10 出错率
  const ranked = rankStat(stat).slice(0, 10);
  const barLabels = ranked.map(r => "#" + r.num);
  const barVals = ranked.map(r => Math.round(r.wrong / r.tries * 100));
  // 排行列表（TOP10）
  const ul = container.querySelector(".stat-rank");
  rankStat(stat).slice(0, 10).forEach(r => {
    const q = curBank.questions.find(x => x.num === r.num);
    const li = document.createElement("li");
    li.innerHTML = `<div class="sr-info"><b>#${r.num}</b>${q ? " " + (q.text || "").slice(0, 30) : ""}
      <div class="sr-meta">做 ${r.tries} 次 · 错 ${r.wrong} 次 · 对 ${r.tries - r.wrong} 次</div></div>
      <div class="sr-rate">${Math.round(r.wrong / r.tries * 100)}%</div>`;
    if (q) li.onclick = () => reviewQuestion(q);
    ul.appendChild(li);
  });

  if (typeof Chart !== "undefined") {
    new Chart(document.getElementById("statLine"), {
      type: "line",
      data: { labels: lineData.map(d => d.x), datasets: [{ label: "正确率%", data: lineData.map(d => d.y), borderColor: "#2563eb", backgroundColor: "rgba(37,99,235,.1)", fill: true, tension: .3 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } },
    });
    new Chart(document.getElementById("statPie"), {
      type: "pie",
      data: { labels: ["答对", "答错"], datasets: [{ data: [okCount, errCount], backgroundColor: ["#16a34a", "#dc2626"] }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } },
    });
    new Chart(document.getElementById("statBar"), {
      type: "bar",
      data: { labels: barLabels, datasets: [{ label: "出错率%", data: barVals, backgroundColor: "#f59e0b" }] },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, scales: { x: { min: 0, max: 100 } } },
    });
  } else {
    container.innerHTML += '<div class="empty"><p>图表库加载失败，请重装 App。</p></div>';
  }
}

function rankStat(stat) {
  return Object.entries(stat)
    .map(([num, r]) => ({ num: Number(num), ...r, rate: r.wrong / r.tries }))
    .filter(r => r.tries > 0)
    .sort((a, b) => b.rate - a.rate || a.num - b.num);
}
function topN(stat) { return rankStat(stat).slice(0, 10); }

/* ========== 滑动手势（左滑下一题 / 右滑上一题） ========== */
let touchStartX = 0, touchStartY = 0, touchMoved = false;
function bindSwipe() {
  const area = document.getElementById("quizArea");
  area.addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
  }, { passive: true });
  area.addEventListener("touchmove", (e) => {
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
    if (touchMoved && Math.abs(dx) > Math.abs(dy) * 1.2) e.preventDefault();
  }, { passive: false });
  area.addEventListener("touchend", (e) => {
    if (!touchMoved || !session) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      if (dx < 0) next();   // 左滑 → 下一题（练习模式直接判分）
      else prev();          // 右滑 → 上一题
    }
  }, { passive: true });
}

/* ========== 收藏 FAB：可拖动 + 位置记忆 ========== */
const FAB_POS_KEY = "zz_fab_pos_v1";
function restoreFabPos() {
  const fab = document.getElementById("favFab");
  const saved = loadLS(FAB_POS_KEY, null);
  if (saved && typeof saved.x === "number" && typeof saved.y === "number") {
    fab.style.left = saved.x + "px";
    fab.style.top = saved.y + "px";
  } else {
    // 默认右下角
    fab.style.left = (window.innerWidth - 20 - 56) + "px";
    fab.style.top = (window.innerHeight - 90 - 56) + "px";
  }
}
function bindFabDrag() {
  const fab = document.getElementById("favFab");
  restoreFabPos();

  // 点击收藏（非拖动时）
  fab.addEventListener("click", (e) => {
    if (fab.__dragged) { fab.__dragged = false; return; }
    toggleFavFab();
  });

  let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
  fab.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    ox = fab.offsetLeft; oy = fab.offsetTop;
    dragging = false;
    e.stopPropagation();
  }, { passive: true });
  fab.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) dragging = true;
    if (dragging) {
      let nx = ox + dx, ny = oy + dy;
      // 边界约束
      nx = Math.max(0, Math.min(nx, window.innerWidth - 56));
      ny = Math.max(0, Math.min(ny, window.innerHeight - 56));
      fab.style.left = nx + "px";
      fab.style.top = ny + "px";
      e.preventDefault();
    }
    e.stopPropagation();
  }, { passive: false });
  fab.addEventListener("touchend", (e) => {
    if (dragging) {
      fab.__dragged = true;
      saveLS(FAB_POS_KEY, { x: fab.offsetLeft, y: fab.offsetTop });
      // 触发一次重绘后复位标记，避免误触发点击
      setTimeout(() => { fab.__dragged = false; }, 100);
    }
    e.stopPropagation();
  }, { passive: true });
}

/* ========== Android 返回手势（@capacitor/app） ========== */
let backPressedOnce = false;
function getCurrentView() {
  const isVisible = id => !document.getElementById(id).classList.contains("hidden");
  if (isVisible("quizArea")) return "quiz";
  if (isVisible("resultArea")) return "result";
  if (isVisible("subView")) return "sub";
  return "setup";
}
function bindBackButton() {
  const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (!App) return;   // 网页版无该插件，跳过
  App.addListener("backButton", async () => {
    // 弹窗打开时：返回手势先关闭弹窗（视为取消），不往下走
    const mask = document.getElementById("modalMask");
    if (mask && !mask.classList.contains("hidden")) {
      closeModal();
      return;
    }
    const view = getCurrentView();
    if (view === "quiz") {
      // 回看模式：直接退出回设置页，不保存进度
      if (session && session.review) { quitQuiz(); return; }
      // 答题中：练习保存进度退出；考试直接放弃
      const isPractice = session && session.mode === "practice";
      const ok = await showDialog({
        title: isPractice ? "退出并保存进度？" : "确认退出考试？",
        text: isPractice ? "退出后将保存当前进度，下次可继续。" : "退出后本次考试不保存，成绩不计入。",
        okText: "退出", cancelText: "继续答题",
      });
      if (ok) quitQuiz();
    } else if (view === "result" || view === "sub") {
      // 结果页 / 错题本/收藏/统计：回设置页
      resetToSetup();
    } else {
      // 设置页：双击退出（2 秒内第二次返回才退出）
      if (backPressedOnce) {
        App.exitApp();
      } else {
        backPressedOnce = true;
        toast("再按一次退出");
        setTimeout(() => { backPressedOnce = false; }, 2000);
      }
    }
  });
}
function bindLifecycleSave() {
  const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) {
    App.addListener("pause", () => { if (session) saveResume(); });
    App.addListener("appStateChange", (s) => { if (s && !s.isActive && session) saveResume(); });
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && session) saveResume();
  });
}
function toast(msg) {
  let t = document.getElementById("toastMsg");
  if (!t) {
    t = document.createElement("div");
    t.id = "toastMsg";
    t.style.cssText = "position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = "0"; }, 1500);
}

/* ========== 自定义弹窗（替代原生 confirm/alert） ========== */
function showDialog({ title = "", text = "", okText = "确定", cancelText = null }) {
  return new Promise((resolve) => {
    const mask = document.getElementById("modalMask");
    const tEl = document.getElementById("modalTitle");
    const bEl = document.getElementById("modalBody");
    const okBtn = document.getElementById("modalOk");
    const cancelBtn = document.getElementById("modalCancel");
    tEl.textContent = title;
    bEl.textContent = text;
    okBtn.textContent = okText;
    cancelBtn.classList.toggle("hidden", !cancelText);
    cancelBtn.textContent = cancelText || "取消";
    mask.classList.remove("hidden");
    const done = (val) => {
      mask.classList.add("hidden");
      okBtn.onclick = null; cancelBtn.onclick = null;
      window.__modalResolve = null;
      resolve(val);
    };
    okBtn.onclick = () => done(true);
    cancelBtn.onclick = () => done(false);
    window.__modalResolve = done;   // 供返回手势等外部关闭：__modalResolve(false)
  });
}
function closeModal() {
  if (typeof window.__modalResolve === "function") window.__modalResolve(false);
  else {
    const mask = document.getElementById("modalMask");
    if (mask) mask.classList.add("hidden");
  }
}
